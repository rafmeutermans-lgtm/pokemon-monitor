name: Pokemon monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # elke 5 min; GitHub kan runs enkele minuten vertragen
  workflow_dispatch:         # handmatig starten via het tabblad Actions
    inputs:
      mode:
        description: "run = normaal, test = alleen testmelding, list = toon gevonden producten"
        type: choice
        options: [run, test, list]
        default: run

permissions:
  contents: write            # nodig om state.json terug te committen

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run monitor
        run: python monitor.py ${{ inputs.mode == 'test' && '--test' || (inputs.mode == 'list' && '--list' || '') }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update state"
            git pull --rebase
            git push
          fi
